limit_req_zone $binary_remote_addr zone=hr_login:10m rate=10r/m;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React gọi /hr-api/... và /leave-api/...; Nginx bỏ tiền tố rồi chuyển tiếp
  location = /hr-api/auth/login {
    limit_req zone=hr_login burst=5 nodelay;
    limit_req_status 429;
    rewrite ^/hr-api/auth/login$ /auth/login break;
    proxy_pass http://hr-service:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /hr-api/ {
    proxy_pass http://hr-service:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /leave-api/ {
    proxy_pass http://leave-service:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}

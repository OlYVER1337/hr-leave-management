server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve service names at request time so the demo frontend can start by itself.
  # Docker's embedded DNS is available at 127.0.0.11 inside the Compose network.
  resolver 127.0.0.11 valid=30s ipv6=off;

  location /hr-api/ {
    set $hr_backend hr-service;
    rewrite ^/hr-api/(.*)$ /$1 break;
    proxy_pass http://$hr_backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /leave-api/ {
    set $leave_backend leave-service;
    rewrite ^/leave-api/(.*)$ /$1 break;
    proxy_pass http://$leave_backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
